<title>数の勇者クエスト ― 中学数学RPG</title>
<style>
  :root{
    --bg:#14122b; --bg2:#221f45; --panel:#f3e4c3; --ink:#2a2340;
    --gold:#e6b64c; --gold-d:#a9781f; --hp:#58c46a; --hp2:#2f8a44;
    --dmg:#d84c4c; --water:#4a9bd8; --shadow:rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:radial-gradient(circle at 50% -20%, #2d2860 0%, #14122b 60%), #14122b;
    color:var(--panel); display:flex; justify-content:center; align-items:center;
    min-height:100dvh; overflow:hidden; user-select:none;
  }
  #app{width:100%; max-width:440px; height:100dvh; max-height:900px;
    position:relative; display:flex; flex-direction:column; padding:12px; gap:10px;}
  .mono{font-family:"SFMono-Regular",Consolas,"Courier New",monospace;}
  .window{background:var(--panel); color:var(--ink); border:3px solid #0c0a1c; border-radius:10px;
    box-shadow:0 4px 0 #0c0a1c, 0 8px 18px var(--shadow), inset 0 0 0 3px var(--panel), inset 0 0 0 5px var(--gold-d);
    padding:14px 16px;}
  .screen{display:none; flex:1; flex-direction:column; gap:10px; min-height:0;}
  .screen.active{display:flex;}
  .btn{font-family:inherit; font-weight:800; font-size:16px; letter-spacing:.03em; color:#2a2340; background:var(--gold);
    border:3px solid #0c0a1c; border-radius:8px; padding:12px 14px; cursor:pointer; width:100%;
    box-shadow:0 3px 0 var(--gold-d); transition:transform .05s, box-shadow .05s;}
  .btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--gold-d);}
  .btn.sub{background:#cdbfe0; box-shadow:0 3px 0 #6a5b86;}
  .btn.sub:active{box-shadow:0 0 0 #6a5b86;}
  .btn:disabled{opacity:.45; cursor:default; box-shadow:0 3px 0 var(--gold-d);}
  #title{justify-content:center; text-align:center; align-items:center; gap:18px;}
  .logo{line-height:1.15;}
  .logo .sub{font-size:14px; color:var(--gold); letter-spacing:.35em; margin-bottom:6px;}
  .logo .main{font-size:42px; font-weight:900; color:var(--panel); text-shadow:3px 3px 0 #0c0a1c, 0 0 18px rgba(230,182,76,.4);}
  .logo .main em{color:var(--gold); font-style:normal;}
  .logo .tag{font-size:13px; color:#c9bde0; margin-top:10px; letter-spacing:.1em;}
  .title-hero{font-size:64px; filter:drop-shadow(0 6px 0 #0c0a1c); animation:bob 2.2s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-8px);}}
  #title .btns{width:100%; max-width:280px; display:flex; flex-direction:column; gap:10px;}
  .topbar{display:flex; gap:8px; align-items:stretch;}
  .stat-chip{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 6px; gap:2px;}
  .stat-chip .lab{font-size:10px; color:var(--gold-d); font-weight:800; letter-spacing:.1em;}
  .stat-chip .val{font-size:18px; font-weight:900;}
  .map-title{font-size:13px; font-weight:800; color:var(--gold-d); letter-spacing:.12em; margin-bottom:2px;}
  .area-list{display:flex; flex-direction:column; gap:8px; overflow-y:auto; flex:1; padding-right:2px;}
  .area{display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px;}
  .area .emoji{font-size:30px; width:40px; text-align:center;}
  .area .info{flex:1; min-width:0;}
  .area .nm{font-size:16px; font-weight:900;}
  .area .tp{font-size:11px; color:var(--gold-d); font-weight:700;}
  .area .clear{font-size:11px; color:var(--hp2); font-weight:800; white-space:nowrap;}
  .area.locked{opacity:.5; cursor:default;}
  .area .lock{font-size:22px;}
  .map-row{display:flex; gap:8px;}
  .map-row .btn{flex:1;}
  #status{gap:10px;}
  .buddy-card{text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .buddy-emoji{font-size:80px; filter:drop-shadow(0 6px 0 #0c0a1c); animation:bob 2.4s ease-in-out infinite;}
  .buddy-name{font-size:20px; font-weight:900;}
  .buddy-stage{font-size:12px; color:var(--gold-d); font-weight:800; letter-spacing:.1em;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .stat-box{background:#fff8e8; border:2px solid var(--gold-d); border-radius:6px; padding:8px 10px;}
  .stat-box .lab{font-size:10px; color:var(--gold-d); font-weight:800;}
  .stat-box .val{font-size:20px; font-weight:900;}
  .bar{height:14px; background:#3a2f1a; border:2px solid #0c0a1c; border-radius:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; width:0; transition:width .4s ease;}
  .bar.exp > i{background:var(--water);}
  .bar.bond > i{background:var(--gold);}
  #battle{gap:8px;}
  .enemy-stage{flex:1; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; position:relative;}
  .enemy-emoji{font-size:76px; filter:drop-shadow(0 8px 6px rgba(0,0,0,.5));}
  .enemy-name{font-size:14px; font-weight:800; color:var(--panel); letter-spacing:.05em;}
  .floaty{position:absolute; font-weight:900; font-size:26px; pointer-events:none;
    animation:floaty 1s ease-out forwards; text-shadow:2px 2px 0 #0c0a1c;}
  @keyframes floaty{0%{opacity:1; transform:translateY(0) scale(1.2);}100%{opacity:0; transform:translateY(-46px) scale(1);}}
  .hp-line{display:flex; align-items:center; gap:8px; width:100%; max-width:320px;}
  .hp-line .who{font-size:11px; font-weight:800; width:52px;}
  .hp-line .bar{flex:1;}
  .hp-line.enemy .bar > i{background:linear-gradient(#e0655f,#d84c4c);}
  .hp-line.hero  .bar > i{background:linear-gradient(#6fd07f,#2f8a44);}
  .hp-line .num{font-size:11px; font-weight:800; width:54px; text-align:right;}
  .combo{position:absolute; top:6px; right:6px; text-align:right;}
  .combo .n{font-size:22px; font-weight:900; color:var(--gold); text-shadow:2px 2px 0 #0c0a1c; line-height:1;}
  .combo .l{font-size:9px; color:var(--gold); letter-spacing:.1em;}
  .msg{min-height:26px; font-size:15px; font-weight:800; text-align:center;}
  .q-box{text-align:center; padding:16px;}
  .q-tag{font-size:10px; font-weight:800; color:var(--gold-d); letter-spacing:.15em; margin-bottom:8px;}
  .q-text{font-size:25px; font-weight:900; line-height:1.4; word-break:break-word;}
  .q-text sup{font-size:.62em;}
  .answer-line{margin-top:12px; font-family:"SFMono-Regular",Consolas,monospace; font-size:30px; font-weight:900;
    min-height:40px; letter-spacing:.05em; border-bottom:4px solid var(--gold-d); display:inline-block; min-width:120px; padding:0 12px;}
  .answer-line.blink{animation:blink .6s step-start infinite;}
  @keyframes blink{50%{background:rgba(230,182,76,.35);}}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
  .key{font-family:"SFMono-Regular",Consolas,monospace; font-size:24px; font-weight:900; padding:14px 0;
    background:var(--panel); color:var(--ink); border:3px solid #0c0a1c; border-radius:8px; box-shadow:0 3px 0 var(--gold-d); cursor:pointer;}
  .key:active{transform:translateY(3px); box-shadow:0 0 0 var(--gold-d);}
  .key.ok{background:var(--gold);}
  .overlay{position:absolute; inset:0; display:none; z-index:30; background:rgba(10,8,24,.78); backdrop-filter:blur(2px);
    align-items:center; justify-content:center; padding:20px; animation:fade .25s ease;}
  .overlay.show{display:flex;}
  @keyframes fade{from{opacity:0;}}
  .overlay .window{max-width:340px; width:100%; text-align:center;}
  .over-emoji{font-size:70px; filter:drop-shadow(0 6px 0 #0c0a1c);}
  .over-title{font-size:24px; font-weight:900; margin:6px 0; color:var(--gold-d);}
  .over-lines{font-size:15px; font-weight:700; line-height:1.7;}
  .sparkle{animation:spin 1.2s ease-in-out;}
  @keyframes spin{0%{transform:scale(.4) rotate(-20deg);opacity:0;}60%{transform:scale(1.15) rotate(8deg);}100%{transform:scale(1) rotate(0);}}
  .shake{animation:shake .35s;}

  .mute{position:absolute; top:14px; right:14px; z-index:5; background:none; border:none; font-size:20px; cursor:pointer; opacity:.8;}

</style>

<script>
"use strict";
/* ===== 保存（localStorage永続 / 失敗時メモリ） ===== */
const KEY="mathquest_save_v2"; const mem={};
const store={
  save(o){ try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){mem[KEY]=JSON.stringify(o);} },
  load(){ try{const s=localStorage.getItem(KEY); if(s)return JSON.parse(s);}catch(e){}
          try{const s=mem[KEY]; if(s)return JSON.parse(s);}catch(e){} return null; },
};
/* ===== サウンド ===== */
let muted=false, actx=null;
function beep(freq,dur,type){ if(muted)return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||"square"; o.frequency.value=freq; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.08,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx={ ok(){beep(660,.08);setTimeout(()=>beep(880,.1),70);}, ng(){beep(160,.18,"sawtooth");},
  crit(){beep(880,.06);setTimeout(()=>beep(1180,.06),60);setTimeout(()=>beep(1560,.12),120);},
  hit(){beep(120,.14,"triangle");}, lvup(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.14),i*90));},
  win(){[659,784,988].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*80));} };

/* ===== ヘルパー ===== */
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function nz(a,b){let v;do{v=ri(a,b);}while(v===0);return v;}
function pick(a){return a[ri(0,a.length-1)];}
function par(n){return n<0?"("+n+")":""+n;}
function coef(a){return a===1?"":a===-1?"−":""+a;}
function term(n,v){ if(n===0)return""; const s=n>0?" + ":" − "; const m=Math.abs(n); return s+(m===1&&v?"":m)+(v||""); }
function divisors(n){const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d;}
function factor(n){return "(x " + (n>0?"+ "+n:"− "+(-n)) + ")";}

/* ===== ジェネレータ（答えは整数1つ） ===== */
// 中1
function gSeisu(){
  const t=pick(["add","sub","mul","div"]);
  if(t==="add"){const a=nz(-12,12),b=nz(-12,12);return{tag:"正負の数",q:`${par(a)} + ${par(b)}`,a:a+b};}
  if(t==="sub"){const a=nz(-12,12),b=nz(-12,12);return{tag:"正負の数",q:`${par(a)} − ${par(b)}`,a:a-b};}
  if(t==="mul"){const a=nz(-9,9),b=nz(-9,9);return{tag:"正負の数",q:`${par(a)} × ${par(b)}`,a:a*b};}
  const b=nz(-9,9),ans=nz(-9,9),a=b*ans;return{tag:"正負の数",q:`${par(a)} ÷ ${par(b)}`,a:ans};
}
function gDainyu(){ const x=nz(-6,7),a=nz(-6,6),b=nz(-9,9);
  return{tag:"式の値",q:`x = ${x} のとき<br>${coef(a)}x${term(b)} の値`,a:a*x+b}; }
function gEq1(){ const x=ri(-7,8),a=nz(2,8),b=nz(-9,9),c=a*x+b;
  return{tag:"一次方程式",q:`${a}x${term(b)} = ${c}<br>x = ?`,a:x}; }
function gHirei(){
  if(Math.random()<.5){const a=nz(2,6),x=nz(-5,6);return{tag:"比例",q:`y = ${coef(a)}x について<br>x = ${x} のとき y = ?`,a:a*x};}
  const a=pick([12,18,24,36,48,60]);const x=pick(divisors(a));return{tag:"反比例",q:`y = ${a}/x について<br>x = ${x} のとき y = ?`,a:a/x};
}
// 中2
function gShiki(){ const x=nz(-5,6),A=nz(1,5),B=nz(-6,6),C=nz(1,5),D=nz(-6,6),op=pick(["+","−"]);
  const val= op==="+"?(A+C)*x+(B+D):(A-C)*x+(B-D);
  return{tag:"式の計算",q:`x = ${x} のとき<br>(${coef(A)}x${term(B)}) ${op} (${coef(C)}x${term(D)})`,a:val}; }
function gEq2(){ const x=ri(-4,5),y=ri(-4,5); let a1=nz(1,4),b1=nz(-4,4),a2=nz(1,4),b2=nz(-4,4);
  while(a1*b2-a2*b1===0){a2=nz(1,4);b2=nz(-4,4);}
  const c1=a1*x+b1*y,c2=a2*x+b2*y;
  return{tag:"連立方程式",q:`${coef(a1)}x${term(b1,"y")} = ${c1}<br>${coef(a2)}x${term(b2,"y")} = ${c2}<br>x = ?`,a:x}; }
function gLinear(){
  if(Math.random()<.55){const a=nz(-4,5),b=nz(-8,8),x=nz(-5,6);
    return{tag:"一次関数",q:`一次関数 y = ${coef(a)}x${term(b)}<br>x = ${x} のとき y = ?`,a:a*x+b};}
  const a=nz(-5,6),b=nz(-6,6); let x1=nz(-5,5),x2=nz(-5,5); while(x2===x1)x2=nz(-5,5);
  const y1=a*x1+b,y2=a*x2+b;
  return{tag:"一次関数",q:`2点 (${x1}, ${y1}), (${x2}, ${y2}) を通る<br>直線の 変化の割合 は？`,a:a};
}
// 中3
function gExpand(){
  if(Math.random()<.5){const p=nz(-5,5),q=nz(-5,5),k=nz(-4,5);
    return{tag:"展開",q:`${factor(p)}${factor(q)} を展開して<br>x = ${k} のとき の値`,a:(k+p)*(k+q)};}
  const p=nz(-6,6),q=nz(-6,6),b=p+q,c=p*q; let s="x²"+term(b,"x"); s+= c!==0?term(c):"";
  return{tag:"因数分解",q:`${s} を因数分解すると<br>(x + a)(x + b)<br>a, b のうち 大きい方は？`,a:Math.max(p,q)};
}
function gRoot3(){
  const t=pick(["sqrt","sq","mul"]);
  if(t==="sqrt"){const r=ri(2,14);return{tag:"平方根",q:`√${r*r}`,a:r};}
  if(t==="sq"){const r=ri(2,12);return{tag:"平方根",q:`(√${r})²`,a:r};}
  const r=ri(2,8),target=r*r,divs=divisors(target).filter(d=>d>1&&d<target);
  if(divs.length===0)return{tag:"平方根",q:`√${target}`,a:r};
  const a=pick(divs),b=target/a; return{tag:"平方根",q:`√${a} × √${b}`,a:r};
}
function gQuad(){
  if(Math.random()<.4){const r=ri(2,11);return{tag:"二次方程式",q:`x² = ${r*r}<br>正の解 x = ?`,a:r};}
  const p=nz(-7,7),q=nz(-7,7),b=-(p+q),c=p*q; let s="x²"+term(b,"x"); s+= c!==0?term(c):"";
  return{tag:"二次方程式",q:`${s} = 0<br>大きい方の解 x = ?`,a:Math.max(p,q)};
}
function gQuadFunc(){
  const a=nz(-3,3);
  if(Math.random()<.55){const x=nz(-5,5);return{tag:"関数 y=ax²",q:`y = ${coef(a)}x²<br>x = ${x} のとき y = ?`,a:a*x*x};}
  let p=nz(-4,4),q=nz(-4,4); while(q===p)q=nz(-4,4); const lo=Math.min(p,q),hi=Math.max(p,q);
  return{tag:"関数 y=ax²",q:`y = ${coef(a)}x² で<br>x が ${lo} から ${hi} まで<br>ふえるときの 変化の割合 は？`,a:a*(lo+hi)};
}

/* ===== ワールド定義 ===== */
const b1=[
  {nm:"すうちの森", emoji:"🌲", topic:"正負の数", gen:[gSeisu],
    en:[["スライム","🟢"],["こうもり","🦇"],["キノコ","🍄"],["いたずら妖精","🧚"]], boss:["森の主 ボアキング","🐗"]},
  {nm:"文字の谷", emoji:"✏️", topic:"文字式・式の値", gen:[gDainyu,gSeisu],
    en:[["ゴブリン","👹"],["おばけ","👻"],["ミミック","📦"],["いわ人形","🪨"]], boss:["谷のヌシ","🦂"]},
  {nm:"方程式の川原", emoji:"🏞️", topic:"一次方程式", gen:[gEq1,gDainyu],
    en:[["カニ","🦀"],["カエル","🐸"],["ヘビ","🐍"],["さかな人","🐟"]], boss:["水龍リバイア","🐉"]},
  {nm:"比例の丘", emoji:"📈", topic:"比例・反比例", gen:[gHirei,gEq1],
    en:[["ワシ","🦅"],["ヤギ","🐐"],["風のせい","🌬️"],["みならい鬼","👺"]], boss:["天秤の番人","⚖️"]},
];
const b2=[
  {nm:"多項式の林", emoji:"🌿", topic:"式の計算", gen:[gShiki,gDainyu],
    en:[["マンドラゴラ","🌱"],["ハチ","🐝"],["トレント","🌳"],["こびと","🧌"]], boss:["林の巨獣","🦍"]},
  {nm:"連立の洞窟", emoji:"🕳️", topic:"連立方程式", gen:[gEq2,gShiki],
    en:[["ガイコツ","💀"],["こうもり王","🦇"],["スパイダー","🕷️"],["ゴーレム","🗿"]], boss:["双子ゴーレム","🗿"]},
  {nm:"関数の峠", emoji:"📉", topic:"一次関数", gen:[gLinear,gEq2],
    en:[["ペガサス","🐴"],["ワイバーン","🦎"],["雷鳥","🦉"],["やまの主","🐺"]], boss:["直線龍リニア","🐲"]},
];
const b3=[
  {nm:"展開の遺跡", emoji:"🏛️", topic:"展開・因数分解", gen:[gExpand,gShiki],
    en:[["ミイラ","🧟"],["石像","🗿"],["まほうじん","🔮"],["スカラベ","🪲"]], boss:["守護者アヌビス","🐕"]},
  {nm:"平方根の泉", emoji:"💧", topic:"平方根", gen:[gRoot3,gExpand],
    en:[["ウンディーネ","🧜"],["カッパ","🥒"],["水クラゲ","🎐"],["氷のせい","❄️"]], boss:["泉の女王","🧜‍♀️"]},
  {nm:"二次方程式の門", emoji:"🚪", topic:"二次方程式", gen:[gQuad,gRoot3],
    en:[["ナイト","🛡️"],["ガーゴイル","🦇"],["魔導士","🧙"],["ドラゴン子","🐲"]], boss:["門番グランド","🐉"]},
  {nm:"放物線の頂", emoji:"🌌", topic:"関数 y=ax²", gen:[gQuadFunc,gQuad],
    en:[["星のせい","⭐"],["彗星","☄️"],["夜行鳥","🦉"],["幻獣","🦄"]], boss:["まおう ゼロ","😈"]},
];
const WORLDS={
  b1:{key:"b1", nm:"中学1年", sub:"正負の数〜比例", emoji:"1️⃣", areas:b1},
  b2:{key:"b2", nm:"中学2年", sub:"式の計算〜一次関数", emoji:"2️⃣", areas:b2},
  b3:{key:"b3", nm:"中学3年", sub:"展開〜二次関数", emoji:"3️⃣", areas:b3},
  adv:{key:"adv", nm:"ぼうけんモード", sub:"全学年 通しで冒険", emoji:"🗺️", areas:[...b1,...b2,...b3]},
};
const WORLD_ORDER=["b1","b2","b3","adv"];

/* ===== 相棒 進化 ===== */
const BUDDY=[
  {nm:"たまご",         emoji:"🥚", need:0,   atk:1},
  {nm:"リザ",           emoji:"🦎", need:12,  atk:2},
  {nm:"ワニゴン",       emoji:"🐊", need:32,  atk:4},
  {nm:"ドラゴン",       emoji:"🐉", need:70,  atk:7},
  {nm:"キングドラゴン", emoji:"🐲", need:140, atk:12},
];

/* ===== ゲーム状態 ===== */
let G=null;
function newGame(){ return {lv:1,exp:0,gold:0,atk:5,maxHp:20,hp:20,bond:0,buddyStage:0,
  correct:0,maxCombo:0, cl:{b1:0,b2:0,b3:0,adv:0}, world:"b1",area:0,areaKills:0}; }
function expNext(lv){return 6+lv*4;}
function buddyStageOf(bond){let s=0;for(let i=0;i<BUDDY.length;i++)if(bond>=BUDDY[i].need)s=i;return s;}
function totalAtk(){return G.atk + BUDDY[G.buddyStage].atk;}

/* ===== 画面制御 ===== */
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");}
function updateChips(){ [["mLv","mHp","mGold"],["wLv","wHp","wGold"]].forEach(([l,h,g])=>{
  if($(l)){$(l).textContent=G.lv;$(h).textContent=G.maxHp;$(g).textContent=G.gold;} }); }

function renderWorlds(){
  updateChips(); const list=$("worldList"); list.innerHTML="";
  WORLD_ORDER.forEach(k=>{ const w=WORLDS[k],c=G.cl[k]||0,total=w.areas.length,done=c>=total;
    const el=document.createElement("button"); el.className="window area";
    el.innerHTML=`<span class="emoji">${w.emoji}</span>
      <span class="info"><span class="nm">${w.nm}</span><span class="tp">${w.sub}</span></span>
      <span class="clear">${done?"★クリア":c+" / "+total}</span>`;
    el.onclick=()=>{ G.world=k; renderMap(k); show("map"); };
    list.appendChild(el);
  });
}
function renderMap(k){
  updateChips(); $("mapWorldName").textContent="▶ "+WORLDS[k].nm+" ― "+WORLDS[k].sub;
  const list=$("areaList"); list.innerHTML=""; const areas=WORLDS[k].areas,c=G.cl[k]||0;
  areas.forEach((ar,i)=>{ const locked=i>c,cleared=i<c;
    const el=document.createElement("button"); el.className="window area"+(locked?" locked":"");
    el.innerHTML=`<span class="emoji">${locked?"❔":ar.emoji}</span>
      <span class="info"><span class="nm">${locked?"？？？":ar.nm}</span>
      <span class="tp">${locked?"まだ 行けない":ar.topic}</span>
      ${cleared?'<span class="clear">★クリア済み</span>':""}</span>
      ${locked?'<span class="lock">🔒</span>':""}`;
    if(!locked) el.onclick=()=>startArea(k,i);
    list.appendChild(el);
  });
}
function renderStatus(){
  const b=BUDDY[G.buddyStage];
  $("bEmoji").textContent=b.emoji; $("bName").textContent=b.nm;
  const next=BUDDY[G.buddyStage+1];
  if(next){$("bStage").textContent=`つぎのしんかまで あと ${next.need-G.bond}`;
    const span=next.need-b.need; $("bBar").style.width=Math.min(100,(G.bond-b.need)/span*100)+"%";}
  else{$("bStage").textContent="さいしゅうしんか！"; $("bBar").style.width="100%";}
  $("sLv").textContent=G.lv; $("sAtk").textContent=G.atk; $("sHp").textContent=G.maxHp; $("sTotal").textContent=totalAtk();
  $("sExp").style.width=Math.min(100,G.exp/expNext(G.lv)*100)+"%";
  $("sCorrect").textContent=G.correct; $("sCombo").textContent=G.maxCombo;
}

/* ===== バトル ===== */
let B=null, combo=0, curInput="0", qStart=0, busy=false;
function startArea(k,i){ G.world=k; G.area=i; G.areaKills=0; G.hp=G.maxHp; show("battle"); nextEnemy(true); }
function makeEnemy(){
  const ar=WORLDS[G.world].areas[G.area], depth=G.area, isBoss=G.areaKills>=4, base=6+depth*4;
  const name=isBoss?ar.boss[0]:ar.en[G.areaKills][0];
  const emoji=isBoss?ar.boss[1]:ar.en[G.areaKills][1];
  const hp=isBoss? base*3+8 : base+ri(0,4)+G.areaKills*2;
  const atk=Math.max(2, Math.round(3+depth*1.4+(isBoss?3:0)));
  return {name,emoji,isBoss,hp,maxHp:hp,atk};
}
function newProblem(){ return pick(WORLDS[G.world].areas[G.area].gen)(); }
function nextEnemy(first){
  B=makeEnemy(); combo=0; updateCombo();
  $("enemyEmoji").textContent=B.emoji; $("enemyName").textContent=B.name+(B.isBoss?" 👑":"");
  drawHp(); setMsg((first?"":"つぎの てきだ！ ")+`${B.name} が あらわれた！`); loadProblem();
}
function loadProblem(){ B.prob=newProblem(); $("qTag").textContent=B.prob.tag; $("qText").innerHTML=B.prob.q;
  curInput="0"; renderInput(); qStart=performance.now(); }
function renderInput(){$("ansLine").textContent=curInput;}
function drawHp(){
  $("enemyHp").style.width=Math.max(0,B.hp/B.maxHp*100)+"%"; $("heroHp").style.width=Math.max(0,G.hp/G.maxHp*100)+"%";
  $("enemyHpN").textContent=Math.max(0,B.hp)+"/"+B.maxHp; $("heroHpN").textContent=Math.max(0,G.hp)+"/"+G.maxHp;
}
function setMsg(t){$("battleMsg").innerHTML=t;}
function updateCombo(){ const w=$("comboWrap"); if(combo>=2){w.style.display="block"; $("comboN").textContent=combo;} else w.style.display="none"; }
function floaty(text,color){ const s=$("enemyStage"),f=document.createElement("div");
  f.className="floaty"; f.textContent=text; f.style.color=color; f.style.left="50%"; f.style.top="42px"; f.style.transform="translateX(-50%)";
  s.appendChild(f); setTimeout(()=>f.remove(),1000); }
function keypadPress(k){
  if(k==="ok"){submitAnswer();return;}
  if(k==="del"){curInput=curInput.length<=1||(curInput.length===2&&curInput[0]==="-")?"0":curInput.slice(0,-1);renderInput();beep(300,.03);return;}
  if(k==="sign"){curInput=curInput.startsWith("-")?curInput.slice(1):(curInput==="0"?"-":"-"+curInput);renderInput();beep(300,.03);return;}
  if(curInput==="0")curInput=k; else if(curInput==="-")curInput="-"+k; else if(curInput.replace("-","").length<4)curInput+=k;
  renderInput(); beep(520,.02);
}
function submitAnswer(){
  if(busy)return; const val=parseInt(curInput,10); if(isNaN(val))return; busy=true;
  if(val===B.prob.a){
    const fast=(performance.now()-qStart)<6000;
    combo++; if(combo>G.maxCombo)G.maxCombo=combo; G.correct++; G.bond++;
    const ns=buddyStageOf(G.bond); let evolved=ns>G.buddyStage; if(evolved)G.buddyStage=ns;
    const comboBonus=Math.floor(combo/2); let dmg=totalAtk()+comboBonus+ri(0,2);
    const crit=fast&&combo>=2; if(crit)dmg=Math.round(dmg*1.8); B.hp-=dmg;
    if(crit){sfx.crit();floaty("かいしん！ "+dmg,"#e6b64c");} else{sfx.ok();floaty(dmg+" ダメージ","#fff");}
    $("enemyEmoji").classList.add("flash"); setTimeout(()=>$("enemyEmoji").classList.remove("flash"),300);
    updateCombo(); drawHp(); setMsg(crit?"クリティカル！ するどい！":"せいかい！ こうげき！");
    setTimeout(()=>{ if(B.hp<=0){enemyDown(evolved);} else{ if(evolved)showEvolve(()=>afterTurn()); else afterTurn(); } },650);
  }else{
    sfx.ng(); combo=0; updateCombo(); G.hp-=B.atk;
    $("enemyStage").classList.add("shake"); setTimeout(()=>$("enemyStage").classList.remove("shake"),350);
    sfx.hit(); floaty("−"+B.atk,"#ff9a9a"); drawHp();
    setMsg(`ざんねん！ せいかいは <b>${B.prob.a}</b> … ${B.atk}のダメージ！`);
    setTimeout(()=>{ if(G.hp<=0){heroDown();} else{loadProblem();busy=false;} },1100);
  }
}
function afterTurn(){loadProblem();busy=false;}
function enemyDown(evolved){
  const wasBoss=B.isBoss, exp=(B.isBoss?12:5)+G.area*3, gold=(B.isBoss?30:8)+G.area*4+ri(0,5);
  G.exp+=exp; G.gold+=gold; sfx.win(); setMsg(`${B.name} を たおした！ +${exp}EXP +${gold}G`);
  let leveled=[];
  while(G.exp>=expNext(G.lv)){ G.exp-=expNext(G.lv); G.lv++; const hpUp=ri(4,7),atkUp=ri(2,3);
    G.maxHp+=hpUp; G.atk+=atkUp; G.hp=G.maxHp; leveled.push({lv:G.lv,hpUp,atkUp}); }
  drawHp(); save();
  setTimeout(()=>{
    const proceed=()=>{ if(wasBoss){areaClear();return;} G.areaKills++; nextEnemy(false); busy=false; };
    const afterLv=()=>{ if(evolved) showEvolve(proceed); else proceed(); };
    if(leveled.length) showLevelUp(leveled,afterLv); else afterLv();
  },700);
}
function heroDown(){ sfx.ng();
  showOverlay("💫","ちからつきた…",`${WORLDS[G.world].areas[G.area].nm} の とちゅうで たおれた…<br>かいふくして マップへ もどろう。`,
    ()=>{ G.hp=G.maxHp; hideOverlay(); save(); renderMap(G.world); show("map"); busy=false; },"マップへ");
}
function areaClear(){
  const k=G.world, areas=WORLDS[k].areas, i=G.area;
  if(i===(G.cl[k]||0)) G.cl[k]=Math.min(areas.length,i+1);
  save(); const last=i>=areas.length-1;
  if(last){ showOverlay(WORLDS[k].emoji,"ワールドクリア！",
      `${WORLDS[k].nm} を せいは した！<br>「${WORLDS[k].sub}」を マスター！<br>（何度でも あそべます）`,
      ()=>{hideOverlay();renderMap(k);show("map");busy=false;},"やった！"); }
  else{ const nx=areas[i+1]; showOverlay(nx.emoji,"エリアクリア！",
      `${areas[i].nm} を せいは した！<br>あたらしい ちいき<br><b>「${nx.nm}」</b>(${nx.topic}) が ひらけた！`,
      ()=>{hideOverlay();renderMap(k);show("map");busy=false;},"つぎへ"); }
}
function showOverlay(emoji,title,lines,cb,btn){
  $("ovEmoji").textContent=emoji; $("ovEmoji").className="over-emoji sparkle";
  $("ovTitle").textContent=title; $("ovLines").innerHTML=lines; $("ovBtn").textContent=btn||"つづける";
  $("overlay").classList.add("show"); $("ovBtn").onclick=cb;
}
function hideOverlay(){$("overlay").classList.remove("show");}
function showLevelUp(list,cb){ sfx.lvup();
  const lines=list.map(l=>`Lv.${l.lv} に なった！<br>さいだいHP +${l.hpUp} / こうげき +${l.atkUp}`).join("<br><br>");
  showOverlay("⭐","レベルアップ！",lines+"<br><br>HPが ぜんかい！",()=>{hideOverlay();cb();},"やった！");
}
function showEvolve(cb){ sfx.lvup(); const b=BUDDY[G.buddyStage];
  showOverlay(b.emoji,"あいぼうが しんか！",`おや…！？ あいぼうの ようすが…<br><b>${b.nm}</b> に しんかした！<br>そうこうげき力が あがった！`,
    ()=>{hideOverlay();cb();},"すごい！");
}
function buildKeypad(){
  const kp=$("keypad"); kp.innerHTML=""; const keys=["1","2","3","4","5","6","7","8","9","±","0","⌫"], map={"±":"sign","⌫":"del"};
  keys.forEach(k=>{ const b=document.createElement("button"); b.className="key"; b.textContent=k; b.onclick=()=>keypadPress(map[k]||k); kp.appendChild(b); });
  const ok=document.createElement("button"); ok.className="key ok"; ok.textContent="けってい"; ok.style.gridColumn="span 3"; ok.style.fontSize="18px";
  ok.onclick=()=>keypadPress("ok"); kp.appendChild(ok);
}
window.addEventListener("keydown",e=>{
  if(!$("battle").classList.contains("active"))return;
  if(/[0-9]/.test(e.key))keypadPress(e.key);
  else if(e.key==="-")keypadPress("sign");
  else if(e.key==="Backspace")keypadPress("del");
  else if(e.key==="Enter")keypadPress("ok");
});

/* ===== 遷移・保存 ===== */
function save(){store.save(G);}
function refreshContinueBtn(){ $("btnContinue").disabled=!store.load(); }
$("btnStart").onclick=()=>{ G=newGame(); save(); renderWorlds(); show("worldSelect"); };
$("btnContinue").onclick=()=>{ const s=store.load(); if(s){G=Object.assign(newGame(),s); renderWorlds(); show("worldSelect");} };
$("btnStatusW").onclick=()=>{ renderStatus(); show("status"); };
$("btnBack").onclick=()=>{ renderWorlds(); show("worldSelect"); };
$("btnToWorlds").onclick=()=>{ renderWorlds(); show("worldSelect"); };
$("btnRestW").onclick=()=>{ G.hp=G.maxHp; save(); updateChips();
  $("btnRestW").textContent="かいふくした！"; setTimeout(()=>$("btnRestW").textContent="やすむ(全回復)",900); };
$("muteBtn").onclick=()=>{ muted=!muted; $("muteBtn").textContent=muted?"🔇":"🔊"; if(!muted)sfx.ok(); };

buildKeypad(); refreshContinueBtn();
</script>
